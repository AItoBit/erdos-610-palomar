name: Build and Audit the Draft
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Challenge and Solution
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Report all advertised theorem axioms
        run: lake env lean Audit.lean 2>&1 | tee axioms.log
      - name: Require permitted axioms before submission
        run: python3 scripts/check_axioms.py axioms.log
